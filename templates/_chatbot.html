<button type="button" class="chatbot-bulle" id="chatbot-bulle" onclick="basculerChatbot()" aria-label="Ouvrir l'assistant">
    <i class="fa-solid fa-comment-dots"></i>
</button>

<div class="chatbot-panneau" id="chatbot-panneau">
    <div class="chatbot-entete">
        <div>
            <strong>Assistant KBTO</strong>
            <small>Réponse instantanée</small>
        </div>
        <button type="button" class="chatbot-fermer" onclick="basculerChatbot()" aria-label="Fermer">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="chatbot-messages" id="chatbot-messages">
        <div class="chatbot-groupe">
            <div class="chatbot-message assistant">Bonjour et bienvenue sur l'assistant KBTO. Pour préciser votre demande, votre question porte sur :</div>
            <div class="chatbot-options" id="chatbot-options-initiales">
                {% for option in menu_principal_chatbot %}
                <button type="button" class="chatbot-option" data-id="{{ option.id }}" data-libelle="{{ option.libelle }}" onclick="envoyerOptionChatbot(this)">{{ option.libelle }}</button>
                {% endfor %}
            </div>
            <div class="chatbot-pied">
                <span class="chatbot-avatar"><i class="fa-solid fa-robot"></i></span>
                <span class="chatbot-heure" data-heure-initiale></span>
            </div>
        </div>
    </div>

    <form class="chatbot-saisie" id="chatbot-formulaire" onsubmit="return envoyerMessageChatbot(event)">
        <input type="text" id="chatbot-saisie-texte" placeholder="Taper un message" maxlength="500" autocomplete="off">
        <button type="submit" aria-label="Envoyer"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
</div>

<script>
    function basculerChatbot() {
        document.getElementById('chatbot-panneau').classList.toggle('ouvert');
    }

    function heureActuelle() {
        var maintenant = new Date();
        var heures = String(maintenant.getHours()).padStart(2, '0');
        var minutes = String(maintenant.getMinutes()).padStart(2, '0');
        return heures + 'h' + minutes;
    }

    // L'heure du message d'accueil est calculee en JS (et non au rendu de la
    // page) pour refleter l'heure a laquelle l'utilisateur ouvre le chat,
    // pas l'heure de generation de la page.
    document.querySelectorAll('[data-heure-initiale]').forEach(function (element) {
        element.textContent = heureActuelle();
    });

    function ajouterMessageClient(texte) {
        var zone = document.getElementById('chatbot-messages');
        var element = document.createElement('div');
        element.className = 'chatbot-message client';
        element.textContent = texte;
        zone.appendChild(element);
        zone.scrollTop = zone.scrollHeight;
    }

    function ajouterGroupeAssistant(texte, options) {
        var zone = document.getElementById('chatbot-messages');

        var groupe = document.createElement('div');
        groupe.className = 'chatbot-groupe';

        var bulle = document.createElement('div');
        bulle.className = 'chatbot-message assistant';
        bulle.textContent = texte;
        groupe.appendChild(bulle);

        if (options && options.length) {
            var conteneurOptions = document.createElement('div');
            conteneurOptions.className = 'chatbot-options';
            options.forEach(function (option) {
                var bouton = document.createElement('button');
                bouton.type = 'button';
                bouton.className = 'chatbot-option';
                bouton.textContent = option.libelle;
                bouton.setAttribute('onclick', 'envoyerOptionChatbot(this)');
                bouton.setAttribute('data-id', option.id);
                bouton.setAttribute('data-libelle', option.libelle);
                conteneurOptions.appendChild(bouton);
            });
            groupe.appendChild(conteneurOptions);
        }

        var pied = document.createElement('div');
        pied.className = 'chatbot-pied';
        pied.innerHTML = '<span class="chatbot-avatar"><i class="fa-solid fa-robot"></i></span><span class="chatbot-heure"></span>';
        pied.querySelector('.chatbot-heure').textContent = heureActuelle();
        groupe.appendChild(pied);

        zone.appendChild(groupe);
        zone.scrollTop = zone.scrollHeight;
        return groupe;
    }

    function desactiverOptions(groupeBouton) {
        // Une fois un bouton clique, on desactive tout le groupe de boutons
        // (pas de re-clic sur un choix deja fait dans cet echange).
        var conteneur = groupeBouton.closest('.chatbot-options');
        if (conteneur) {
            conteneur.querySelectorAll('.chatbot-option').forEach(function (b) { b.disabled = true; });
        }
    }

    function appelerAssistant(corps, groupeChargement) {
        var jeton = document.querySelector('meta[name="csrf-token"]').content;

        fetch('{{ url_for("portail_assistant_message") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': jeton
            },
            body: JSON.stringify(corps)
        })
        .then(function (reponse) { return reponse.json(); })
        .then(function (donnees) {
            groupeChargement.remove();
            ajouterGroupeAssistant(donnees.reponse || "Une erreur est survenue.", donnees.menu || []);
        })
        .catch(function () {
            groupeChargement.remove();
            ajouterGroupeAssistant("Impossible de contacter l'assistant pour le moment.", []);
        });
    }

    function envoyerOptionChatbot(bouton) {
        desactiverOptions(bouton);
        ajouterMessageClient(bouton.getAttribute('data-libelle'));
        var groupeChargement = ajouterGroupeAssistant('...', []);
        appelerAssistant({ option_id: bouton.getAttribute('data-id') }, groupeChargement);
    }

    function envoyerMessageChatbot(evenement) {
        evenement.preventDefault();

        var champ = document.getElementById('chatbot-saisie-texte');
        var message = champ.value.trim();
        if (!message) { return false; }

        ajouterMessageClient(message);
        champ.value = '';

        var groupeChargement = ajouterGroupeAssistant('...', []);
        appelerAssistant({ message: message }, groupeChargement);

        return false;
    }
</script>
